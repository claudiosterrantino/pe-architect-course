apiVersion: apps/v1
kind: Deployment
metadata:
  name: urlshortener-front
  labels:
    app: urlshortener-front
    app.kubernetes.io/name: urlshortener-front
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: urlshortener-suite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urlshortener-front
  template:
    metadata:
      labels:
        app: urlshortener-front
        app.kubernetes.io/name: urlshortener-front
      annotations:
        # Annotazione di provenance per conformità a Gatekeeper
        # TODO: commit-sha
        commit: "a1b2c3d4e5f6"
    spec:
      containers:
        - name: front
          image: urlshortener-front:local
          ports:
            - containerPort: 8080
              name: http
          env:
            # Configurazione opzionale se colleghi un backend URL shortener
            - name: BASE_URL
              value: "http://localhost:8081"
            - name: REDIRECTOR_URL
              value: "http://localhost:8082"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            limits:
              cpu: "150m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: urlshortener-front-svc
  labels:
    app: urlshortener-front
    app.kubernetes.io/name: urlshortener-front
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: urlshortener-front
