apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: falcorootprevention
spec:
  crd:
    spec:
      names:
        kind: FalcoRootPrevention
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptUsers:
              type: array
              items:
                type: string
            exemptImages:
              type: array
              items:
                type: string
            exemptNamespaces:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package falco.root.prevention

        is_exempt_image(image) {
          exempt := input.parameters.exemptImages[_]
          contains(image, exempt)
        }

        is_exempt_namespace(namespace) {
          exempt := input.parameters.exemptNamespaces[_]
          namespace == exempt
        }

        # Controlla se l'utente appartiene alle eccezioni dichiarate nei parametri
        is_exempt_user(user) {
          exempt := input.parameters.exemptUsers[_]
          sprintf("%v", [user]) == exempt
        }

        containers[container] {
          input.review.object.kind == "Pod"
          container := input.review.object.spec.containers[_]
        }

        containers[container] {
          input.review.object.kind == "Deployment"
          container := input.review.object.spec.template.spec.containers[_]
        }

        get_pod_security_context = security_context {
          input.review.object.kind == "Pod"
          security_context := object.get(input.review.object.spec, "securityContext", {})
        }

        get_pod_security_context = security_context {
          input.review.object.kind != "Pod"
          security_context := object.get(input.review.object.spec.template.spec, "securityContext", {})
        }

        # 1. Controlla se runAsUser è specificato a livello di Container
        get_effective_user(container) = user {
          container_security := object.get(container, "securityContext", {})
          container_user := object.get(container_security, "runAsUser", null)
          container_user != null
          user := container_user
        }

        # 2. Se non specificato a livello di Container, controlla il Pod SecurityContext
        get_effective_user(container) = user {
          container_security := object.get(container, "securityContext", {})
          container_user := object.get(container_security, "runAsUser", null)
          container_user == null
          pod_security := get_pod_security_context
          pod_user := object.get(pod_security, "runAsUser", null)
          pod_user != null
          user := pod_user
        }

        # 3. Se non specificato a livello di Container o Pod, ritorna -1 (nessun utente specificato)
        get_effective_user(container) = -1 {
          container_security := object.get(container, "securityContext", {})
          container_user := object.get(container_security, "runAsUser", null)
          container_user == null
          pod_security := get_pod_security_context
          pod_user := object.get(pod_security, "runAsUser", null)
          pod_user == null
        }

        # Verifica runAsNonRoot con precedenza del container sul pod 
        is_run_as_non_root(container) {
          container_security := object.get(container, "securityContext", {})
          object.get(container_security, "runAsNonRoot", null) == true
        }
        # OR (In rego definire più regole con lo stesso identico nome è il modo standard per esprimere un OR)
        is_run_as_non_root(container) {
          container_security := object.get(container, "securityContext", {})
          object.get(container_security, "runAsNonRoot", null) == null
          pod_security := get_pod_security_context
          object.get(pod_security, "runAsNonRoot", false) == true
        }

        # Violazione Root o configurazione non sicura
        violation[{"msg": msg}] {
          not is_exempt_namespace(input.review.object.metadata.namespace)
          container := containers[_]
          not is_exempt_image(container.image)

          effective_user := get_effective_user(container)

          is_violation(effective_user, container)

          msg := sprintf("Container %v is configured to run as root (UID: %v). Falco security policy violation.", [container.name, effective_user])
        }

        is_violation(user, container) {
          user == 0
          not is_exempt_user(user)
        }
        # OR
        is_violation(user, container) {
          user == -1
          not is_run_as_non_root(container)
        }

        # Violazione Privileged mode
        violation[{"msg": msg}] {
          not is_exempt_namespace(input.review.object.metadata.namespace)
          container := containers[_]
          not is_exempt_image(container.image)

          container_security := object.get(container, "securityContext", {})
          privileged := object.get(container_security, "privileged", false)
          privileged == true

          msg := sprintf("Container %v is running in privileged mode. Falco security policy violation.", [container.name])
        }